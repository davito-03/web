<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>davito's blog</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/mobile-optimizations.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=6.5.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <link rel="stylesheet" href="/assets/css/terminal.css">
    <script src="/assets/js/themes.js" defer></script>
    <style>
        .post-content {
            background: rgba(20, 20, 30, 0.7);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ddd;
            line-height: 1.6;
            font-family: 'Inter', sans-serif;
            margin-top: 20px;
        }
        .post-content h1 { color: #00f2fe; margin-bottom: 20px; font-size: 2rem; }
        .post-content h2 { color: #fff; margin-top: 30px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .post-content h3 { color: #ccc; margin-top: 20px; }
        .post-content p { margin-bottom: 15px; }
        .post-content a { color: #4facfe; text-decoration: none; }
        .post-content a:hover { text-decoration: underline; }
        .post-content code { background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; font-family: 'Fira Code', monospace; color: #00ff00; }
        .post-content pre { background: #000; padding: 15px; border-radius: 8px; overflow-x: auto; margin-bottom: 15px; border: 1px solid #333; }
        .post-content img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
        .post-content blockquote { border-left: 4px solid #00f2fe; padding-left: 15px; margin-left: 0; color: #aaa; font-style: italic; }
        .post-date { color: #888; font-size: 0.9rem; margin-bottom: 30px; display: block; }
    </style>
</head>

<body class="messages-page">
        <div class="container" style="max-width: 900px;">
        <div id="post-content" class="post-content">
            <!-- Markdown content will be rendered here -->
            <div class="loading">
                <div class="loading-text">DECODING_DATA_STREAM...</div>
            </div>
        </div>

        <!-- Reactions Section -->
        <div class="reactions-container"
            style="margin-top: 30px; padding: 20px; border: 1px solid #00ff00; background: rgba(0,0,0,0.5); text-align: center;">
            <h3 style="color: #00ff00; font-family: 'Inter', sans-serif; font-size: 12px; margin-bottom: 15px;">
                REACTION_MODULE</h3>
            <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
                <button onclick="toggleReaction('like')" class="reaction-btn" data-type="like">
                    👍 <span id="count-like">0</span>
                </button>
                <button onclick="toggleReaction('fire')" class="reaction-btn" data-type="fire">
                    🔥 <span id="count-fire">0</span>
                </button>
                <button onclick="toggleReaction('heart')" class="reaction-btn" data-type="heart">
                    ❤️ <span id="count-heart">0</span>
                </button>
                <button onclick="toggleReaction('rocket')" class="reaction-btn" data-type="rocket">
                    🚀 <span id="count-rocket">0</span>
                </button>
            </div>
        </div>

        <!-- Share Section -->
        <div class="share-container" style="margin-top: 20px; text-align: center;">
            <p style="color: #00ff00; font-family: 'Fira Code'; font-size: 12px; margin-bottom: 10px;">>>
                SHARE_PROTOCOL_INITIATED</p>
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button onclick="sharePost('twitter')"
                    style="background: #1da1f2; color: white; border: none; padding: 8px 15px; font-family: 'Fira Code'; cursor: pointer; border-radius: 5px;">
                    <i class="fab fa-twitter"></i> Twitter
                </button>
                <button onclick="sharePost('whatsapp')"
                    style="background: #25d366; color: white; border: none; padding: 8px 15px; font-family: 'Fira Code'; cursor: pointer; border-radius: 5px;">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </button>
                <button onclick="sharePost('copy')"
                    style="background: #333; color: white; border: 1px solid #00ff00; padding: 8px 15px; font-family: 'Fira Code'; cursor: pointer; border-radius: 5px;">
                    <i class="fas fa-link"></i> Copy Link
                </button>
            </div>
        </div>

        <div id="comments-section" class="comments-section"></div>
        <script src="/assets/js/terminal.js"></script>
        <script type="module" src="/assets/js/secrets.js"></script>
        <script type="module" src="/assets/js/pages/post.js"></script>
  <script src="/assets/js/site-shell.js?v=3.2" defer></script>
</body>

</html>
