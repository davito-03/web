<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizando davito.es…</title>
  <meta http-equiv="Cache-Control" content="no-store">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; text-align: center; }
    p { opacity: .8; }
  </style>
</head>
<body>
  <div>
    <h1>Limpiando caché del navegador…</h1>
    <p>En un segundo vuelves a la web.</p>
  </div>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      } catch (e) {}
      location.replace('/?fixed=' + Date.now());
    })();
  </script>
</body>
</html>
