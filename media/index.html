<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Galería de davito</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="/assets/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=6.5.1">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.webp">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.webp">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#00BFFF">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: all 0.5s ease;
    }


    body.light-theme {
      background: radial-gradient(ellipse at bottom, #E8F4FD 0%, #B3E5FC 100%);
      color: #2C3E50;
    }

    body.light-theme .space-title {
      background: linear-gradient(45deg, #1976D2, #42A5F5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px rgba(25, 118, 210, 0.5);
    }

    body.light-theme .subtitle {
      color: #1976D2;
    }

    body.light-theme .category-card {
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(25, 118, 210, 0.3);
      color: #2C3E50;
    }

    /* Pantalla de splash estilo guns.lol */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.6s ease-out;
    }

    .splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 90%;
    }

    /* Reloj en el splash screen */
    .splash-clock {
      font-size: 1.5em;
      letter-spacing: 3px;
      color: #00ff00;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
      font-family: 'Courier New', monospace;
      margin-bottom: 20px;
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {

      0%,
      100% {
        text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
      }

      50% {
        text-shadow: 0 0 20px rgba(0, 255, 0, 1);
      }
    }

    .splash-text {
      font-size: 1.2em;
      letter-spacing: 2px;
      text-transform: lowercase;
      animation: blink 1.5s infinite;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0.3;
      }
    }

    /* Líneas decorativas alrededor del texto */
    .splash-decoration {
      margin: 20px 0;
      opacity: 0.7;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .splash-text {
        font-size: 1em;
        letter-spacing: 1px;
      }

      .splash-clock {
        font-size: 1.2em;
        letter-spacing: 2px;
      }
    }

    @media (max-width: 480px) {
      .splash-text {
        font-size: 0.8em;
        letter-spacing: 0.5px;
      }

      .splash-clock {
        font-size: 1em;
        letter-spacing: 1px;
      }
    }

    /* Efecto de desvanecimiento cuando se hace clic */
    .splash-screen.fade-out {
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    body.light-theme .category-card:hover {
      border-color: rgba(25, 118, 210, 0.8);
      box-shadow:
        0 20px 40px rgba(25, 118, 210, 0.3),
        0 0 20px rgba(25, 118, 210, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    body.light-theme .category-card::before {
      background: linear-gradient(135deg, rgba(25, 118, 210, 0.1), rgba(66, 165, 245, 0.1));
    }

    body.light-theme .category-name {
      color: #1976D2;
    }


    .toast {
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
      font-weight: 500;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(-100px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-left: 4px solid #4CAF50;
    }

    .toast.info {
      border-left: 4px solid #2196F3;
    }

    .toast.warning {
      border-left: 4px solid #FF9800;
    }

    .toast.error {
      border-left: 4px solid #F44336;
    }

    body.light-theme .toast {
      background: rgba(255, 255, 255, 0.95);
      color: #2C3E50;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }


    .skeleton-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(0, 191, 255, 0.2);
      border-radius: 15px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      min-height: 300px;
      position: relative;
      animation: skeleton-pulse 1.5s ease-in-out infinite alternate;
    }

    .skeleton-preview {
      height: 140px;
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(255, 255, 255, 0.2) 50%,
          rgba(255, 255, 255, 0.1) 100%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 2s infinite;
    }

    .skeleton-content {
      padding: 20px;
    }

    .skeleton-title {
      height: 24px;
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(255, 255, 255, 0.2) 50%,
          rgba(255, 255, 255, 0.1) 100%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 2s infinite;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .skeleton-text {
      height: 16px;
      width: 70%;
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(255, 255, 255, 0.2) 50%,
          rgba(255, 255, 255, 0.1) 100%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 2s infinite 0.5s;
      border-radius: 4px;
    }

    @keyframes skeleton-pulse {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0.7;
      }
    }

    @keyframes skeleton-shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    body.light-theme .skeleton-card {
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid rgba(25, 118, 210, 0.2);
    }

    body.light-theme .skeleton-preview,
    body.light-theme .skeleton-title,
    body.light-theme .skeleton-text {
      background: linear-gradient(90deg,
          rgba(0, 0, 0, 0.1) 0%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.1) 100%);
      background-size: 200% 100%;
    }


    #star-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }


    #particles-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }


    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle ease-in-out infinite alternate;
    }

    .shooting-star {
      position: absolute;
      background: linear-gradient(90deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 1px;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.3;
        transform: scale(1);
      }

      100% {
        opacity: 1;
        transform: scale(1.2);
      }
    }


    header {
      text-align: center;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }

    .space-title {
      font-size: 3rem;
      background: linear-gradient(45deg, #fde68a, #f9a8d4, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 12px rgba(251, 191, 36, 0.35));
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #87CEEB;
      opacity: 0.8;
    }


    #category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin: 40px auto;
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }


    #category-grid .category-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(0, 191, 255, 0.3);
      border-radius: 15px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(10px);
      min-height: 0;
      transform-style: preserve-3d;
      perspective: 1000px;
      position: relative;
    }

    #category-grid .category-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(0, 191, 255, 0.1), rgba(135, 206, 235, 0.1));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
    }

    #category-grid .category-card:hover::before {
      opacity: 1;
    }

    #category-grid .category-card:hover {
      transform: translateY(-8px) rotateX(5deg) rotateY(5deg) scale(1.02);
      border-color: rgba(0, 191, 255, 0.8);
      box-shadow:
        0 20px 40px rgba(0, 191, 255, 0.3),
        0 0 20px rgba(0, 191, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }


    #category-grid .category-preview {
      height: 220px;
      position: relative;
      background: #0b1220;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      overflow: hidden;
      flex: 1 1 auto;
    }

    #category-grid .category-preview.count-1 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    #category-grid .category-preview.count-2 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }

    #category-grid .category-preview.count-3 img:first-child {
      grid-row: 1 / span 2;
    }

    #category-grid .category-preview img {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }

    #category-grid .category-card:hover .category-preview img {
      transform: scale(1.04);
    }


    #category-grid .category-name {
      padding: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #00BFFF;
      text-transform: capitalize;
      background: rgba(0, 0, 0, 0.8);
      margin: 0;
      text-align: center;
      border-top: 1px solid rgba(0, 191, 255, 0.2);
    }


    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    @media (max-width: 768px) {
      .space-title {
        font-size: 2.5rem;
      }

      #category-grid {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        padding: 0 15px;
      }

      #category-grid .category-card {
        min-height: 0;
      }

      #category-grid .category-preview {
        height: 170px;
      }

      #category-grid .category-name {
        font-size: 1.1rem;
        padding: 15px;
      }
    }

    @media (max-width: 480px) {
      .space-title {
        font-size: 2rem;
      }

      #category-grid {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 15px;
      }

      #category-grid .category-preview {
        height: 140px;
      }

      #category-grid .category-name {
        font-size: 1rem;
        padding: 12px;
      }
    }
  </style>

</head>

<body>







  <div id="toast-container" style="
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  "></div>




  <script>
    // Sistema de efectos de sonido
    const AudioSystem = {
      context: null,
      sounds: {},

      init() {
        try {
          this.context = new (window.AudioContext || window.webkitAudioContext)();
          this.createSounds();
        } catch (error) {
          console.warn('Audio no disponible:', error);
        }
      },

      createSounds() {
        // Sonido de hover (tono suave)
        this.sounds.hover = this.createTone(800, 0.1, 0.05);
        // Sonido de click (tono más definido)
        this.sounds.click = this.createTone(1000, 0.15, 0.1);
        // Sonido de success (acorde agradable)
        this.sounds.success = this.createChord([523, 659, 784], 0.3, 0.15);
      },

      createTone(frequency, duration, volume = 0.1) {
        return () => {
          if (!this.context) return;

          const oscillator = this.context.createOscillator();
          const gainNode = this.context.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(this.context.destination);

          oscillator.frequency.setValueAtTime(frequency, this.context.currentTime);
          oscillator.type = 'sine';

          gainNode.gain.setValueAtTime(0, this.context.currentTime);
          gainNode.gain.linearRampToValueAtTime(volume, this.context.currentTime + 0.01);
          gainNode.gain.linearRampToValueAtTime(0, this.context.currentTime + duration);

          oscillator.start(this.context.currentTime);
          oscillator.stop(this.context.currentTime + duration);
        };
      },

      createChord(frequencies, duration, volume = 0.1) {
        return () => {
          if (!this.context) return;

          frequencies.forEach((freq, index) => {
            setTimeout(() => {
              const oscillator = this.context.createOscillator();
              const gainNode = this.context.createGain();

              oscillator.connect(gainNode);
              gainNode.connect(this.context.destination);

              oscillator.frequency.setValueAtTime(freq, this.context.currentTime);
              oscillator.type = 'sine';

              gainNode.gain.setValueAtTime(0, this.context.currentTime);
              gainNode.gain.linearRampToValueAtTime(volume / frequencies.length, this.context.currentTime + 0.01);
              gainNode.gain.linearRampToValueAtTime(0, this.context.currentTime + duration);

              oscillator.start(this.context.currentTime);
              oscillator.stop(this.context.currentTime + duration);
            }, index * 50);
          });
        };
      },

      play(soundName) {
        if (this.sounds[soundName]) {
          this.sounds[soundName]();
        }
      }
    };

    // Inicializar audio en primera interacción del usuario
    let audioInitialized = false;
    document.addEventListener('click', () => {
      if (!audioInitialized) {
        AudioSystem.init();
        audioInitialized = true;
        console.log('🎵 Sistema de audio inicializado');
      }
    }, { once: true });

    // Sistema de notificaciones toast
    window.showToast = function (message, type = 'info', duration = 3000) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      const icons = {
        success: '✅',
        info: 'ℹ️',
        warning: '⚠️',
        error: '❌'
      };

      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <span style="font-size: 16px;">${icons[type]}</span>
        <span>${message}</span>
      `;

      container.appendChild(toast);

      // Trigger animation
      setTimeout(() => toast.classList.add('show'), 100);

      // Auto remove
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 400);
      }, duration);
    };



    // Efectos de sonido para las tarjetas de categoría
    document.addEventListener('mouseover', (e) => {
      if (e.target.closest('.category-card')) {
        AudioSystem.play('hover');
      }
    });

    document.addEventListener('click', (e) => {
      if (e.target.closest('.category-card')) {
        AudioSystem.play('click');
      }
    });

    // Asegurar que las estrellas se inicialicen
    document.addEventListener('DOMContentLoaded', () => {
      console.log('⭐ DOM cargado en media/index.html');
      setTimeout(() => {
        if (typeof initStars === 'function') {
          console.log('⭐ Inicializando estrellas manualmente...');
          initStars();
        } else {
          console.warn('⚠️ Función initStars no encontrada');
        }
      }, 500);
    });
  </script>

  <header>
    <a href="/" style="text-decoration: none;">
      <h1 class="space-title"><i class="fas fa-images" style="font-size: 0.85em; margin-right: 6px;"></i> galería</h1>
    </a>
    <p class="subtitle">disfruta de las imágenes que vaya subiendo ❣️ </p>
  </header>

  <main>
    <div id="category-grid"></div>
  </main>
