<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Connect 4 - davito_03</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=6.5.1">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/mobile-optimizations.css">
    <link rel="stylesheet" href="/assets/css/games.css">
    <link rel="stylesheet" href="/assets/css/terminal.css">

    <style>
        body {
            background: #1a1a2e;
            touch-action: none;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header-panel {
            background: #222;
            border: 2px solid #555;
            border-radius: 10px;
            padding: 10px 20px;
            display: flex;
            gap: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #fff;
            align-items: center;
        }

        .turn-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        .turn-player {
            background: #f00;
            box-shadow: 0 0 10px #f00;
        }

        .turn-cpu {
            background: #ff0;
            box-shadow: 0 0 10px #ff0;
        }

        #game-board {
            background: #0000ff;
            padding: 10px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            max-width: 95vw;
        }

        .slot {
            width: 40px;
            height: 40px;
            background: #1a1a2e;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .piece {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            animation: drop 0.5s ease-out;
        }

        .piece.red {
            background: radial-gradient(#ff6666, #cc0000);
        }

        .piece.yellow {
            background: radial-gradient(#ffff66, #cccc00);
        }

        @keyframes drop {
            from {
                transform: translateY(-300px);
            }

            to {
                transform: translateY(0);
            }
        }

        @keyframes win-pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
                filter: brightness(1.5);
            }

            100% {
                transform: scale(1);
            }
        }

        .piece.win {
            animation: win-pulse 1s infinite;
            border: 3px solid #fff;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: #16213e;
            padding: 40px;
            border: 2px solid #00f;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 0 30px rgba(0, 0, 255, 0.4);
        }

        button {
            padding: 15px 30px;
            margin-top: 15px;
            background: #00f;
            color: #fff;
            border: none;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #4444ff;
        }

        @media (max-width: 500px) {
            .slot {
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="game-wrapper">
        <div style="width: 100%; text-align: left; padding-left: 20px;">
            <a href="/pages/laboratorio" style="color: #fff; text-decoration: none; font-family: monospace;">&lt; Exit</a>
        </div>

        <div class="header-panel">
            <div><span class="turn-indicator turn-player"></span>YOU</div>
            <div id="status-text">YOUR TURN</div>
            <div><span class="turn-indicator turn-cpu"></span>CPU</div>
        </div>

        <div id="game-board">
            <!-- Slots Generated by JS -->
        </div>

        <div class="desktop-instructions"
            style="margin-top: 20px; color: #fff; font-size: 10px; font-family: 'Inter', sans-serif;">
            CLICK COLUMN TO DROP
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="modal active">
        <div class="modal-content">
            <h1 style="color: #00f;">CONNECT 4</h1>
            <p style="margin: 20px 0; font-size: 10px; line-height: 1.5; color: #aaa;">
                Connect 4 pieces in a row.<br>
                Horizontal, Vertical, or Diagonal.
            </p>
            <button id="start-btn">START MATCH</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal">
        <div class="modal-content">
            <h2 id="result-text">YOU WIN!</h2>
            <button id="restart-btn">REMATCH</button>
        </div>
    </div>

    <script src="/assets/js/leaderboard.js"></script>
    <script type="module" src="/assets/js/games/connect4.js"></script>

  <script src="/assets/js/site-shell.js?v=3.2" defer></script>
</body>

</html>
