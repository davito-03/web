<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memory - davito_03</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=6.5.1">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/mobile-optimizations.css">
    <link rel="stylesheet" href="/assets/css/games.css">
    <link rel="stylesheet" href="/assets/css/terminal.css">

    <style>
        body {
            background: #1a1a2e;
            touch-action: pan-y;
            overflow-y: auto;
            text-align: center;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
            color: #0ff;
            font-size: 14px;
            text-shadow: 0 0 5px #0ff;
        }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
            perspective: 1000px;
        }

        .card {
            background: transparent;
            width: 100%;
            aspect-ratio: 1;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .card-front {
            background: linear-gradient(135deg, #2a2a4e, #16213e);
            border: 2px solid #0ff;
            font-size: 30px;
            color: #0ff;
            opacity: 0.5;
        }

        .card-front::after {
            content: '?';
        }

        .card-back {
            background: #0ff;
            color: #000;
            transform: rotateY(180deg);
            font-size: 40px;
            box-shadow: 0 0 20px #0ff;
        }

        .card.matched .card-back {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        /* Particles container (fixed to viewport) */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: #16213e;
            padding: 40px;
            border: 2px solid #0ff;
            text-align: center;
            color: #fff;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        button {
            padding: 15px 30px;
            margin-top: 20px;
            background: #0ff;
            color: #000;
            border: none;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div id="particles"></div>

    <div class="game-wrapper">
        <div style="width: 100%; text-align: left; margin-bottom: 20px;">
            <a href="/pages/laboratorio" style="color: #fff; text-decoration: none; font-family: monospace;">&lt; Exit</a>
        </div>

        <div class="header">
            <div>MOVES: <span id="moves">0</span></div>
            <div>TIME: <span id="time">00:00</span></div>
        </div>

        <div id="game-grid">
            <!-- Cards Generated by JS -->
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="modal active">
        <div class="modal-content">
            <h1 style="color: #0ff;">MEMORY</h1>
            <p style="margin: 20px 0; font-size: 10px; line-height: 1.5; color: #aaa;">
                Find all matching pairs.<br>
                Use your brain power!
            </p>
            <div style="margin-top: 20px;">
                <button class="diff-btn" data-diff="easy" style="border-color: #00ff00; color: #00ff00;">EASY</button>
                <button class="diff-btn" data-diff="medium"
                    style="border-color: #ffff00; color: #ffff00;">MEDIUM</button>
                <button class="diff-btn" data-diff="hard" style="border-color: #ff0000; color: #ff0000;">HARD</button>
            </div>

            <style>
                .diff-btn {
                    background: transparent;
                    border: 2px solid #fff;
                    margin: 5px;
                    padding: 10px 15px;
                    font-family: 'Inter', sans-serif;
                    font-size: 10px;
                    cursor: pointer;
                    transition: transform 0.1s;
                    text-transform: uppercase;
                }

                .diff-btn:hover {
                    transform: scale(1.1);
                    background: rgba(255, 255, 255, 0.1);
                }

                .diff-btn:active {
                    transform: scale(0.95);
                }
            </style>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: #00ff00;">COMPLETED!</h2>
            <p>Moves: <span id="final-moves">0</span></p>
            <p>Time: <span id="final-time">00:00</span></p>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script src="/assets/js/leaderboard.js"></script>
    <script type="module" src="/assets/js/games/memory.js"></script>

  <script src="/assets/js/site-shell.js?v=3.2" defer></script>
</body>

</html>
