<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 - davito_03</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=6.5.1">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/mobile-optimizations.css">
    <link rel="stylesheet" href="/assets/css/games.css">
    <link rel="stylesheet" href="/assets/css/terminal.css">

    <style>
        body {
            background: #111;
            touch-action: none;
            overflow: hidden;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin-bottom: 20px;
        }

        .score-box {
            background: #333;
            color: #fff;
            padding: 5px 15px;
            border-radius: 5px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
        }

        #game-board {
            width: 320px;
            height: 320px;
            background: #222;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
        }

        .tile {
            width: 100%;
            height: 100%;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            color: #fff;
            background: #444;
            transition: transform 0.1s;
        }

        /* Tile Colors */
        .tile-2 {
            background: #eee4da;
            color: #776e65;
        }

        .tile-4 {
            background: #ede0c8;
            color: #776e65;
        }

        .tile-8 {
            background: #f2b179;
        }

        .tile-16 {
            background: #f59563;
        }

        .tile-32 {
            background: #f67c5f;
        }

        .tile-64 {
            background: #f65e3b;
        }

        .tile-128 {
            background: #edcf72;
            font-size: 20px;
        }

        .tile-256 {
            background: #edcc61;
            font-size: 20px;
        }

        .tile-512 {
            background: #edc850;
            font-size: 20px;
        }

        .tile-1024 {
            background: #edc53f;
            font-size: 16px;
        }

        .tile-2048 {
            background: #edc22e;
            font-size: 16px;
            box-shadow: 0 0 10px gold;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #edc22e;
            text-align: center;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        .modal button {
            background: #edc22e;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>

<body>

    <div class="game-wrapper">
        <div style="position: absolute; top: 20px; left: 20px;">
            <a href="/pages/laboratorio" style="color: #fff; text-decoration: none; font-family: monospace;"><span data-i18n="game_back">Back</span></a>
        </div>

        <div class="header">
            <h1 style="color: #edc22e; margin: 0; font-family: 'Inter', sans-serif; font-size: 30px;">2048</h1>
            <div class="score-box">
                SCORE<br><span id="score">0</span>
            </div>
        </div>

        <div id="game-board">
            <!-- Tiles generated by JS -->
        </div>

        <div class="desktop-instructions"
            style="margin-top: 20px; color: #666; font-size: 10px; font-family: 'Inter', sans-serif;">
            <span data-i18n="game_arrows">USE ARROW KEYS TO MOVE</span>
        </div>
        <div class="mobile-controls"
            style="margin-top: 20px; color: #666; font-size: 10px; font-family: 'Inter', sans-serif;">
            SWIPE TO MOVE
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="modal active">
        <div class="modal-content">
            <h1 style="color: #edc22e;">2048</h1>
            <p style="margin: 20px 0; font-size: 12px; line-height: 1.5; color: #aaa;">
                Combine tiles to reach 2048.<br>
                2 + 2 = 4, 4 + 4 = 8...
            </p>
            <button id="start-btn" data-i18n="game_start">START GAME</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal">
        <div class="modal-content">
            <h2 data-i18n="game_over">GAME OVER</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button id="restart-btn">TRY AGAIN</button>
        </div>
    </div>

    <script src="/assets/js/leaderboard.js"></script>
    <script type="module" src="/assets/js/games/game2048.js"></script>

  <script src="/assets/js/site-shell.js?v=3.2" defer></script>
</body>

</html>
