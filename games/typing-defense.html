<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Typing Defense - davito_03</title>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/mobile-optimizations.css">
    <link rel="stylesheet" href="/assets/css/games.css">

    <style>
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Code', monospace;
        }

        #game-container {
            position: relative;
            width: 900px;
            max-width: 95vw;
            height: 600px;
            border: 2px solid #0f0;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        #virus-area {
            position: relative;
            height: 500px;
            overflow: hidden;
        }

        .virus {
            position: absolute;
            font-size: 18px;
            color: #0f0;
            font-weight: bold;
            text-shadow: 0 0 10px #0f0;
            transition: color 0.1s;
        }

        .virus.typing {
            color: #ff0;
            text-shadow: 0 0 10px #ff0;
        }

        #input-zone {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: rgba(0, 255, 0, 0.05);
            border-top: 2px solid #0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #typing-input {
            background: #000;
            border: 2px solid #0f0;
            color: #0f0;
            font-family: inherit;
            font-size: 24px;
            padding: 10px 20px;
            width: 80%;
            text-align: center;
            outline: none;
        }

        #typing-input::placeholder {
            color: #033;
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 14px;
            z-index: 10;
            text-shadow: 0 0 10px #0f0;
        }

        .health-bar {
            position: absolute;
            bottom: 110px;
            left: 10px;
            width: 200px;
            height: 20px;
            border: 2px solid #0f0;
            background: #000;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f0, #0a0);
            width: 100%;
            transition: width 0.3s;
        }

        .exit-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f00;
            color: #fff;
            padding: 8px 12px;
            border: 2px solid #fff;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            z-index: 20;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #0f0;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <a href="/pages/laboratorio" class="exit-btn">? BACK</a>

    <div id="game-container">
        <div class="hud">
            <div><span data-i18n="game_score">SCORE</span>: <span id="score">0</span></div>
            <div style="margin-top: 5px;">COMBO: x<span id="combo">1</span></div>
            <div style="margin-top: 5px; font-size: 10px;">LEVEL: <span id="level">1</span></div>
        </div>

        <div class="health-bar">
            <div class="health-fill" id="health-fill"></div>
        </div>

        <div id="virus-area"></div>

        <div id="input-zone">
            <input type="text" id="typing-input" placeholder="Type to defend..." autocomplete="off" disabled>
            <div style="margin-top: 8px; font-size: 12px; color: #0a0;">Press ENTER to destroy virus</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="game-modal active">
        <div class="modal-box" style="background: rgba(0, 20, 0, 0.95); border: 3px solid #0f0;">
            <h1 style="font-family: 'Inter', sans-serif; color: #0f0; text-shadow: 0 0 20px #0f0; margin-bottom: 20px;">
                TYPING DEFENSE</h1>
            <p class="instructions" style="font-family: 'Fira Code'; line-height: 1.8; margin: 30px 0;">
                <span style="color: #0f0; font-size: 14px;">? SYSTEM ALERT ?</span><br><br>
                Incoming virus attack detected!<br>
                Destroy threats by typing their code.<br><br>
                <span style="color: #ff0;">Type the word and press <kbd
                        style="background: #0f0; color: #000; padding: 2px 8px;">ENTER</kbd></span><br><br>
                Don't let them breach the firewall!
            </p>
            <button id="start-btn" class="game-btn"
                style="background: #0f0; color: #000; border: none; padding: 15px 40px; font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer;">INITIALIZE
                DEFENSE</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="game-modal">
        <div class="modal-box" style="background: rgba(20, 0, 0, 0.95); border: 3px solid #f00;">
            <h2 style="font-family: 'Inter', sans-serif; color: #f00; text-shadow: 0 0 20px #f00; margin-bottom: 30px;">
                ?
                SYSTEM BREACHED ?</h2>
            <div style="margin: 20px 0; font-family: 'Fira Code'; font-size: 14px;">
                <p style="margin: 10px 0;">VIRUSES DESTROYED: <span id="final-score"
                        style="color: #0f0; font-weight: bold;">0</span></p>
                <p style="margin: 10px 0;">SECURITY LEVEL: <span id="final-level"
                        style="color: #ff0; font-weight: bold;">1</span></p>
            </div>
            <button id="restart-btn" class="game-btn"
                style="background: #0f0; color: #000; border: none; padding: 15px 40px; font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer; margin-top: 20px;">SYSTEM
                REBOOT</button>
        </div>
    </div>
    </div>

    <script src="/assets/js/leaderboard.js"></script>
    <script type="module" src="/assets/js/games/typing-defense.js"></script>

  <script src="/assets/js/site-shell.js?v=3.2" defer></script>
</body>

</html>
