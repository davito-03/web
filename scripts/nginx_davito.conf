server {
    limit_req zone=mylimit burst=10 nodelay;
    server_name davito.es www.davito.es;
    root /var/www/html/davito;
    index index.html index.php;

    # ============ SECURITY HEADERS ============
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.gstatic.com https://firestore.googleapis.com https://cdnjs.cloudflare.com https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://discord.com https://firestore.googleapis.com https://firebase.googleapis.com https://www.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://gateway.discord.gg https://api.github.com https://api.lanyard.rest wss://api.lanyard.rest https://ws.audioscrobbler.com https://accounts.spotify.com https://api.spotify.com https://api.deezer.com https://itunes.apple.com https://sedeaplicaciones.minetur.gob.es https://nominatim.openstreetmap.org https://router.project-osrm.org https://api.allorigins.win https://corsproxy.io https://api.codetabs.com; frame-src 'self' https://www.youtube.com; media-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ============ CORS ============
    add_header Access-Control-Allow-Origin "https://davito.es" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # ============ GZIP COMPRESSION ============
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ============ BLOCK SENSITIVE FILES ============
    # Block dotfiles (except .well-known for Certbot)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Block Python, shell scripts, config files, tokens
    location ~* \.(py|sh|ini|env|log|bak|sql|md|txt)$ {
        deny all;
        return 404;
    }

    # Allow games_history.json for Discord status widget
    location = /data/games_history.json {
        allow all;
        expires 60s;
        add_header Cache-Control "public, max-age=60";
    }

    # Block data directory
    location ^~ /data/ {
        deny all;
        return 404;
    }

    # Block scripts directory
    location ^~ /scripts/ {
        deny all;
        return 404;
    }

    # Block .htaccess (redundant with dotfiles but explicit)
    location = /.htaccess {
        deny all;
        return 404;
    }

    # Allow robots.txt (override .txt block)
    location = /robots.txt {
        allow all;
        try_files $uri =404;
    }

    # Allow sitemap.xml
    location = /sitemap.xml {
        allow all;
        try_files $uri =404;
    }

    # ============ CACHING ============
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    location ~* \.(css|js|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ============ PROXY MITECO (GASOLINERAS API) ============
    location /api/miteco/ {
        proxy_pass https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/;
        proxy_ssl_server_name on;
        proxy_set_header Host sedeaplicaciones.minetur.gob.es;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============ MAIN ============
    # Clean URLs: /gasolineras serves gasolineras.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ============ PHP ============
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ============ SSL (Certbot) ============
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/davito.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/davito.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.davito.es) {
        return 301 https://davito.es$request_uri;
    }
    if ($host = davito.es) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name davito.es www.davito.es;
    return 404;
}
